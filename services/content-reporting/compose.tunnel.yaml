# Optional. Configure a dedicated named tunnel's public hostname in Cloudflare first.
# Never put its token in this file, the application, command-line arguments or source control.
services:
  tunnel:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    depends_on:
      reports:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
secrets:
  tunnel_token:
    file: ${ISLEMIND_REPORT_TUNNEL_TOKEN_FILE:?Set an external protected token-file path}
