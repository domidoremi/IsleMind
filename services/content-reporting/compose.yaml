name: islemind-reporting
services:
  reports:
    build: .
    image: islemind-content-reporting:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - reports-data:/data
    environment:
      REPORT_WEB_ORIGINS: ${REPORT_WEB_ORIGINS:-}
      REPORT_MAX_RECORDS: ${REPORT_MAX_RECORDS:-10000}
      REPORT_MAX_NEW_PER_HOUR: ${REPORT_MAX_NEW_PER_HOUR:-500}
      REPORT_REQUESTS_PER_MINUTE: ${REPORT_REQUESTS_PER_MINUTE:-120}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
volumes:
  reports-data:
