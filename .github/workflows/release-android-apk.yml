name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Defaults to package.json version, for example v0.0.0.
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-android-apk:
    name: Build signed release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REQUESTED_TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(bun -e "console.log(require('./package.json').version)")"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${REQUESTED_TAG:-}" ]; then
            TAG="${REQUESTED_TAG}"
          else
            TAG="v${PACKAGE_VERSION}"
          fi
          VERSION="${TAG#v}"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_ISLEMIND_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ISLEMIND_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ISLEMIND_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ORG_GRADLE_PROJECT_ISLEMIND_UPLOAD_KEY_ALIAS ORG_GRADLE_PROJECT_ISLEMIND_UPLOAD_STORE_PASSWORD ORG_GRADLE_PROJECT_ISLEMIND_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for installable release APKs."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Release quality contracts
        run: |
          bun run test:release-readiness-compatibility
          bun run test:android-release-hardening
          bun run test:runtime-budget-governance-compatibility
          bun run test:runtime-privacy-retention-compatibility

      - name: Architecture and recovery contracts
        run: |
          bun run test:vnext-architecture-contract
          bun run test:vnext-walking-skeleton
          bun run test:vnext-task-runtime

      - name: Generate Android project
        run: CI=1 bunx expo prebuild --platform android --clean

      - name: Configure release signing and ABI splits
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/islemind-release.keystore
          bun scripts/configure-android-release.js

      - name: Build release APKs
        shell: bash
        env:
          ORG_GRADLE_PROJECT_ISLEMIND_UPLOAD_STORE_FILE: islemind-release.keystore
          ORG_GRADLE_PROJECT_ISLEMIND_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ISLEMIND_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ISLEMIND_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist-apk
          for model_variant in no-model with-model-small; do
            extra_args=()
            if [ "$model_variant" = "with-model-small" ]; then
              extra_args+=(--fail-on-missing-models)
            fi
            bun scripts/prepare-model-bundle.js --variant "$model_variant" "${extra_args[@]}"
            copied=0
            for build_pass in "universal-64:arm64-v8a,x86_64" "arm64-v8a:arm64-v8a" "x86_64:x86_64" "armeabi-v7a-legacy:armeabi-v7a"; do
              IFS=':' read -r arch abi_filters <<< "$build_pass"
              rm -rf android/app/.cxx android/app/build/outputs/apk/release
              # Keep R8/resource shrinking on the explicit local QA path until an exact-current
              # physical-device regression pass covers startup, recovery, keyboard, themes, and memory.
              (cd android && ISLEMIND_MODEL_BUNDLE="$model_variant" EXPO_PUBLIC_ISLEMIND_MODEL_BUNDLE="$model_variant" ./gradlew assembleRelease --rerun-tasks --no-daemon --stacktrace -PislemindAbiFilters="$abi_filters" -PislemindEnableAbiSplits=false -PislemindUniversalApk=false -PreactNativeArchitectures="$abi_filters" -PhermesEnabled=true)
              shopt -s nullglob
              apks=(android/app/build/outputs/apk/release/*.apk)
              if [ "${#apks[@]}" -ne 1 ]; then
                echo "::error::Expected one APK for $arch $model_variant, found ${#apks[@]}."
                printf '%s\n' "${apks[@]}"
                exit 1
              fi
              target="dist-apk/IsleMind-${VERSION}-${arch}-${model_variant}.apk"
              cp "${apks[0]}" "$target"
              sha256sum "$target" > "${target}.sha256"
              copied=$((copied + 1))
            done
            for required_arch in universal-64 arm64-v8a x86_64 armeabi-v7a-legacy; do
              if [ ! -f "dist-apk/IsleMind-${VERSION}-${required_arch}-${model_variant}.apk" ]; then
                echo "::error::Missing ${required_arch} ${model_variant} APK asset."
                find android/app/build/outputs/apk/release -maxdepth 1 -type f -print || true
                exit 1
              fi
            done
          done
          count="$(find dist-apk -type f -name '*.apk' | wc -l | tr -d ' ')"
          if [ "$count" -lt 8 ]; then
            echo "::error::Expected 8 APK assets, found $count."
            exit 1
          fi
          bun scripts/validate-android-16kb-apk.js --strict dist-apk/*-universal-64-*.apk dist-apk/*-arm64-v8a-*.apk dist-apk/*-x86_64-*.apk

      - name: Remove decoded signing keystore
        if: always()
        shell: bash
        run: rm -f android/app/islemind-release.keystore

      - name: Validate release signing
        run: bun scripts/validate-android-release-signing.js dist-apk/*.apk

      - name: Write release source snapshots
        run: bun scripts/write-release-source-snapshots.js dist-apk/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: islemind-android-release-apks
          path: dist-apk/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="IsleMind ${{ steps.meta.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            gh release create "$TAG" --title "$TITLE" --generate-notes --latest
          fi
          gh release upload "$TAG" dist-apk/* --clobber
