name: Architecture Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    name: Type and Architecture Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Dependency-cycle gate
        run: bun run test:architecture-dependencies

      - name: Dependency and boundary gates
        run: bun run test:architecture-boundary

      - name: Runtime contract gate
        run: bun run test:architecture-contract

      - name: Walking-skeleton integration gate
        run: bun run test:walking-skeleton

      - name: Presentation-controller integration gate
        run: bun run test:presentation-controller

      - name: Conversation message-command integration gate
        run: bun run test:conversation-message-command

      - name: Settings action integration gate
        run: bun run test:settings-actions

      - name: MCP transport compatibility gate
        run: bun run test:mcp-compatibility

      - name: Task-runtime integration gate
        run: bun run test:task-runtime

      - name: Agent parent-run integration gate
        run: bun run test:workflow-run

      - name: Agent task-adapter gate
        run: bun run test:workflow-task-adapter

      - name: Provider activation cancellation gate
        run: bun run test:provider-activation

      - name: Provider stream parsing gate
        run: bun run test:provider-stream-parsing

      - name: Provider parameter transmission gate
        run: bun run test:provider-parameter-matrix

      - name: Reasoning runtime compatibility gate
        run: bun run test:reasoning-runtime-compatibility

      - name: Diagnostics usage SQLite gate
        run: bun run test:diagnostics-usage-sqlite

      - name: Toolchain catalog composition gate
        run: bun run test:toolchain-catalog
