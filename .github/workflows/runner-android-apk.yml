name: Runner Android APK

on:
  workflow_dispatch:

jobs:
  runner-android-apk:
    name: Build debug APK on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANIMAL_ISLAND_UI_REF: ${{ vars.ANIMAL_ISLAND_UI_REF }}
      JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.21.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare RN theme workspace
        run: node scripts/prepare-animal-island-ui.js

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Verify and record build toolchain
        run: node scripts/android-build-toolchain.js

      - name: Generate Android project
        run: CI=1 bunx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: islemind-android-debug-universal-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
